<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social preview card</title>
  <!-- Rendered to assets/og.jpg at 1200x630 by `npm run build:og`. Not linked from the site. -->
  <style>
    @font-face { font-family: "Bai Jamjuree"; font-weight: 700; src: url("../assets/fonts/bai-jamjuree-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family: "Anuphan"; font-weight: 100 700; src: url("../assets/fonts/anuphan-latin-wght-normal.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
    * { box-sizing: border-box; margin: 0; }
    body {
      display: grid;
      grid-template-columns: 1fr 420px;
      width: 1200px;
      height: 630px;
      background: #fbf9fa;
      color: #1e1721;
      font-family: "Anuphan", sans-serif;
    }
    .text {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 64px 0 64px 72px;
    }
    .label {
      font: 400 20px/1 "IBM Plex Mono", monospace;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5d5361;
    }
    h1 {
      font: 700 84px/0.98 "Bai Jamjuree", sans-serif;
      letter-spacing: -0.03em;
    }
    p { font-size: 30px; line-height: 1.35; max-width: 20em; }
    .portrait { background: #de5c8e; overflow: hidden; }
    .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 100%; }
  </style>
</head>
<body>
  <div class="text">
    <span class="label">bosspee.com</span>
    <h1>Peerawit<br>Seemamahawong</h1>
    <p>Computer engineering student at Chulalongkorn University. Data, software, and a homelab.</p>
  </div>
  <div class="portrait"><img src="../assets/img/portrait.webp" alt=""></div>
</body>
</html>
